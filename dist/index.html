<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Trò chơi mô phỏng cuộc đời người Việt bằng 3D: mỗi tình huống đời thường được diễn lại trong những khung cảnh thu nhỏ, từ lúc chào đời đến khi về già.">
<meta name="theme-color" content="#0e1120">
<meta property="og:type" content="website">
<meta property="og:title" content="Một Kiếp Người">
<meta property="og:description" content="Trò chơi mô phỏng cuộc đời người Việt bằng 3D: mỗi tình huống đời thường được diễn lại trong những khung cảnh thu nhỏ, từ lúc chào đời đến khi về già.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>%F0%9F%8F%AE</text></svg>">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Một Kiếp Người</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app" data-mode="title">
  <section id="stage" class="stage" aria-label="Cảnh 3D">
    <div id="world" class="world"></div>
    <div class="stage-vignette" aria-hidden="true"></div>
    <div id="fallback" class="fallback" hidden>
      <div class="fallback-sun"></div><div class="fallback-hill"></div><div class="fallback-hill b"></div>
    </div>
    <div id="bubbles" class="bubbles" aria-live="polite"></div>
    <header id="hud" class="hud" hidden>
      <div class="id-card">
        <div class="age-box"><span id="hudAge" class="age-num">0</span><span class="age-unit">tuổi</span></div>
        <div class="id-text">
          <div id="hudName" class="id-name"></div>
          <div id="hudOcc" class="id-occ"></div>
          <div id="hudMoney" class="id-money"></div>
        </div>
      </div>
      <div class="hud-btns">
        <button id="btnSound" class="icon-btn" type="button" aria-label="Bật/tắt âm thanh">🔊</button>
        <button id="btnMenu" class="icon-btn" type="button" aria-label="Cài đặt">⚙️</button>
        <button id="btnHome" class="icon-btn" type="button" aria-label="Về màn hình chính">⏏</button>
      </div>
    </header>
    <div id="locTag" class="loc-tag" hidden></div>
    <div id="dragHint" class="drag-hint" hidden>Kéo để xoay cảnh</div>
  </section>

  <aside id="panel" class="panel">
    <div id="viewPlay" class="view view-play" hidden>
      <div id="stats" class="stats"></div>
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="tabBody" class="tab-body" role="tabpanel"></div>
    </div>
    <div id="viewCreate" class="view view-create" hidden></div>
    <div id="viewDeath" class="view view-death" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
  </aside>

  <button id="btnAge" class="age-btn" type="button" hidden aria-label="Lớn thêm một tuổi (phím cách)">
    <span class="age-btn-ring" aria-hidden="true"></span>
    <span class="age-btn-plus">+1</span><span class="age-btn-label">tuổi</span>
  </button>

  <div id="titleScreen" class="title-screen">
    <div class="title-card">
      <div class="title-kicker">Trò chơi mô phỏng cuộc đời · 3D</div>
      <h1 class="logo"><span>Một</span> <span>Kiếp</span> <span>Người</span></h1>
      <p class="tagline">Một trong tám tỷ cuộc đời — của riêng bạn.</p>
      <div class="title-actions">
        <button id="btnNew" class="btn btn-primary btn-lg" type="button">Bắt đầu kiếp mới</button>
        <button id="btnContinue" class="btn btn-ghost btn-lg" type="button" hidden></button>
        <div class="title-row">
          <button id="btnGrave" class="btn btn-soft" type="button">🕯️ Nghĩa trang</button>
          <button id="btnAch" class="btn btn-soft" type="button">🏆 Thành tựu</button>
          <button id="btnSettings2" class="btn btn-soft btn-icon" type="button" aria-label="Cài đặt">⚙️</button>
        </div>
      </div>
      <p class="title-foot">Mỗi lựa chọn đều có hậu quả. Sống sao cho đáng.</p>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div id="modalBox" class="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="coach" class="coach" hidden></div>
  <div id="fade" class="fade" aria-hidden="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="js/kn_boot.js"></script>
<script src="js/data.js"></script>
<script src="js/events_early.js"></script>
<script src="js/events_adult.js"></script>
<script src="js/events_mature.js"></script>
<script src="js/characters.js"></script>
<script src="js/fx.js"></script>
<script src="js/env_core.js"></script>
<script src="js/env_indoor.js"></script>
<script src="js/env_outdoor.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
