<div id="app" class="app" data-mode="title">
  <section id="stage" class="stage" aria-label="Cảnh 3D">
    <div id="world" class="world"></div>
    <div class="stage-vignette" aria-hidden="true"></div>
    <div id="fallback" class="fallback" hidden>
      <div class="fallback-sun"></div><div class="fallback-hill"></div><div class="fallback-hill b"></div>
    </div>
    <div id="bubbles" class="bubbles" aria-live="polite"></div>
    <header id="hud" class="hud" hidden>
      <div class="id-card">
        <div class="age-box"><span id="hudAge" class="age-num">0</span><span class="age-unit">tuổi</span></div>
        <div class="id-text">
          <div id="hudName" class="id-name"></div>
          <div id="hudOcc" class="id-occ"></div>
          <div id="hudMoney" class="id-money"></div>
        </div>
      </div>
      <div class="hud-btns">
        <button id="btnSave" class="icon-btn" type="button" aria-label="Lưu & tải game">💾</button>
        <button id="btnSound" class="icon-btn" type="button" aria-label="Bật/tắt âm thanh">🔊</button>
        <button id="btnMenu" class="icon-btn" type="button" aria-label="Cài đặt">⚙️</button>
        <button id="btnHome" class="icon-btn" type="button" aria-label="Về màn hình chính">⏏</button>
      </div>
    </header>
    <div id="locTag" class="loc-tag" hidden></div>
    <div id="dragHint" class="drag-hint" hidden>Kéo để xoay cảnh</div>
  </section>

  <aside id="panel" class="panel">
    <div id="viewPlay" class="view view-play" hidden>
      <div id="stats" class="stats"></div>
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="tabBody" class="tab-body" role="tabpanel"></div>
    </div>
    <div id="viewCreate" class="view view-create" hidden></div>
    <div id="viewDeath" class="view view-death" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
  </aside>

  <button id="btnAge" class="age-btn" type="button" hidden aria-label="Lớn thêm một tuổi (phím cách)">
    <span class="age-btn-ring" aria-hidden="true"></span>
    <span class="age-btn-plus">+1</span><span class="age-btn-label">tuổi</span>
  </button>

  <div id="titleScreen" class="title-screen">
    <div class="title-card">
      <div class="title-kicker">Trò chơi mô phỏng cuộc đời · 3D</div>
      <h1 class="logo"><span>Một</span> <span>Kiếp</span> <span>Người</span></h1>
      <p class="tagline">Một trong tám tỷ cuộc đời — của riêng bạn.</p>
      <button id="btnNews" class="news-pill" type="button"><span id="newsLabel">✨ Có gì mới</span><span id="newsDot" class="news-dot" hidden></span></button>
      <div class="title-actions">
        <button id="btnNew" class="btn btn-primary btn-lg" type="button">Bắt đầu kiếp mới</button>
        <button id="btnContinue" class="btn btn-ghost btn-lg" type="button" hidden></button>
        <button id="btnOnlineCont" class="btn btn-primary btn-lg" type="button" hidden></button>
        <!-- 3 nhóm chính: bấm một ô để mở nhóm đó (mỗi lúc chỉ mở một nhóm) -->
        <div class="hub-tiles">
          <button type="button" class="hub-tile" data-hub="play" aria-expanded="false"><span class="hub-ic">🎯</span><b>Chế độ chơi</b><small>Thử thách · Kịch bản</small></button>
          <button type="button" class="hub-tile" data-hub="mini" aria-expanded="false"><span class="hub-ic">🎮</span><b>Minigame</b><small>Hax · Đua xe · chơi thử</small></button>
          <button type="button" class="hub-tile" data-hub="online" aria-expanded="false"><span class="hub-ic">🌐</span><b>Online</b><small>Solo · Dòng họ · Bảng tin</small></button>
        </div>
        <div class="hub-panel" data-panel="play" hidden>
          <button id="btnDaily" class="btn btn-soft" type="button">🎯 Thử thách hôm nay</button>
          <button id="btnScenario" class="btn btn-soft" type="button">🎬 Kịch bản đặc biệt</button>
        </div>
        <div class="hub-panel" data-panel="mini" hidden>
          <button id="btnArcade" class="btn btn-soft" type="button">🕹️ Chơi thử mọi minigame</button>
          <button id="btnHax" class="btn btn-soft" type="button">⚽ Bóng đá · 🏀 Bóng rổ Hax</button>
          <button id="btnRace" class="btn btn-soft" type="button">🏍️ Đua xe máy</button>
        </div>
        <div class="hub-panel" data-panel="online" hidden>
          <button id="btnOnline" class="btn btn-soft" type="button">🌐 Solo online</button>
          <button id="btnClan" class="btn btn-soft" type="button">🏯 Dòng họ online</button>
          <button id="btnFeed" class="btn btn-soft" type="button">📰 Kiếp hay hôm nay</button>
          <button id="btnGraveOnline" class="btn btn-soft" type="button">🕯️ Nghĩa trang online</button>
          <button id="btnBoard" class="btn btn-soft" type="button">🏆 Bảng xếp hạng</button>
        </div>
        <div class="title-icons">
          <button id="btnGrave" class="btn btn-ghost btn-sm" type="button">🕯️ Nghĩa trang</button>
          <button id="btnTree" class="btn btn-ghost btn-sm" type="button">🌳 Gia phả</button>
          <button id="btnAch" class="btn btn-ghost btn-sm" type="button">🏆 Thành tựu</button>
          <button id="btnSaves" class="btn btn-ghost btn-sm" type="button">💾 Lưu & tải</button>
          <button id="btnInstall" class="btn btn-ghost btn-sm" type="button" hidden>📲 Cài app</button>
          <button id="btnSettings2" class="btn btn-ghost btn-sm" type="button" aria-label="Cài đặt">⚙️ Cài đặt</button>
        </div>
      </div>
      <p class="title-foot">Mỗi lựa chọn đều có hậu quả. Sống sao cho đáng.</p>
      <p class="title-credit">Made by <b>Bảo Khang</b></p>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div id="modalBox" class="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="coach" class="coach" hidden></div>
  <div id="fade" class="fade" aria-hidden="true"></div>
</div>

<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <div class="boot-logo" aria-hidden="true">🏮</div>
    <div class="boot-title">Một Kiếp Người</div>
    <div class="boot-bar"><i id="bootFill"></i></div>
    <div class="boot-txt"><span id="bootMsg">Đang tải trò chơi…</span> <b id="bootPct">0%</b></div>
    <p id="bootTip" class="boot-tip"></p>
    <p id="bootSlow" class="boot-slow" hidden>Mạng hơi chậm, game vẫn đang tải — đừng tắt trang nhé!</p>
  </div>
</div>
<script>
(function () {
  // màn hình chờ: đếm số file game đã tải xong (57 file) rồi tới bước dựng cảnh 3D
  var TOTAL = 57, n = 0, pct = 0, t0 = Date.now(), el = document.getElementById('boot');
  var fill = document.getElementById('bootFill'), msg = document.getElementById('bootMsg'), pc = document.getElementById('bootPct'), tip = document.getElementById('bootTip');
  var TIPS = ['💡 Bấm +1 tuổi (hoặc phím cách) để lớn lên, mỗi năm là một câu chuyện mới.', '💡 Chăm học, giữ sức khoẻ và tâm trạng thì đời dễ thở hơn.', '💡 Mở MXH để nổi tiếng, nhận quảng cáo và livestream.', '💡 Haxball có chế độ online: tạo phòng rồi gửi mã cho bạn bè.', '💡 Máy yếu? Vào ⚙️ Cài đặt → Đồ họa chọn Mượt.', '💡 Nghiệp tốt thì kiếp sau đầu thai vào nhà khá giả hơn.', '💡 Minigame có ghi phím ở dưới, đọc trước khi chơi nhé.'];
  var ti = Math.floor(Math.random() * TIPS.length);
  function nextTip() { tip.textContent = TIPS[ti++ % TIPS.length]; }
  nextTip(); var tipT = setInterval(nextTip, 4000);
  function set(p, m) { pct = Math.max(pct, Math.min(100, p)); fill.style.width = pct + '%'; pc.textContent = Math.round(pct) + '%'; if (m) msg.textContent = m; }
  function onFile(e) { var t = e.target; if (t && t.tagName === 'SCRIPT' && t.src) { n++; set(4 + 76 * n / TOTAL); } }
  document.addEventListener('load', onFile, true); document.addEventListener('error', onFile, true);
  var slowT = setTimeout(function () { if (el.isConnected) document.getElementById('bootSlow').hidden = false; }, 12000);
  function done() {
    if (!el.isConnected || el.classList.contains('out')) return;
    set(100, 'Sẵn sàng!'); clearInterval(tipT); clearTimeout(slowT);
    document.removeEventListener('load', onFile, true); document.removeEventListener('error', onFile, true);
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }, Math.max(150, 600 - (Date.now() - t0)));
  }
  window.KN_LOADER = { set: set, done: done };
  // phòng khi có lỗi: không bao giờ kẹt ở màn hình chờ quá 45 giây sau khi trang tải xong
  window.addEventListener('load', function () { set(80, 'Đang dựng thế giới 3D…'); setTimeout(done, 45000); });
})();
</script>
